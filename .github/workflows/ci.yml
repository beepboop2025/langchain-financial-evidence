name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            core: '1.6.6'
          - python: '3.12'
            core: '1.6.9'
          - python: '3.13'
            core: '1.6.9'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and test dependencies
        env:
          CORE_VERSION: ${{ matrix.core }}
        run: python -m pip install '.[test]' "langchain-core==$CORE_VERSION" build twine
      - name: Run offline native and contract tests
        run: python -m pytest tests/unit_tests --disable-socket --allow-unix-socket -q
      - name: Build and validate package
        run: |
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution-python-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
